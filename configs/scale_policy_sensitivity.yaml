schema_version: 2
experiment_id: stage1_scale_policy_sensitivity_v2_shared_landmark_ls
status: planned_required
full_lafan_authorized: false
amass_motion_runs_authorized: false
source_manifest: manifests/pilot_sequence.yaml
policy_audit: research/OFFICIAL_SCALE_AND_PREPROCESSING_AUDIT.md

required_public_methods:
  - gmr
  - omniretarget
  - protomotions_v2_3
  - protomotions_v3

pre_solver_target_contract:
  required: true
  fields:
    - timestamps
    - root_translation
    - root_heading
    - landmark_names
    - world_positions
    - root_relative_positions
    - orientations_if_used
    - contact_labels
    - body_model_policy
    - human_height_definition
    - root_scale_policy
    - local_scale_policy
    - root_anchor_policy
    - ground_policy
    - robot_asset_sha256
    - joint_order_sha256
    - joint_limit_sha256
    - constraint_graph_sha256

common_policy:
  definition: frame0_root_heading_aligned_shared_semantic_landmark_weighted_scalar_least_squares
  formula: argmin_s sum_k w_k ||s(h_k-h_root) - (r_k-r_root)||^2
  estimator_role: formal_common_policy
  protocol_correction: 2026-07-22-prompt-section-6.7-conformance
  source_frame: 0
  source_root_frame: Hips origin, geometry heading removed, canonical +X forward
  robot_root_frame: neutral canonical Holosoma G1 pelvis, +X forward
  weights: registered equal weight per landmark
  source_landmarks: [Head, LeftArm, RightArm, LeftUpLeg, RightUpLeg, LeftLeg, RightLeg, LeftFoot, RightFoot, LeftToe, RightToe]
  robot_landmarks: [head, left_shoulder, right_shoulder, left_hip, right_hip, left_knee, right_knee, left_ankle, right_ankle, left_toe, right_toe]
  excluded_non_homologous_frames:
    torso: LAFAN Spine2 and G1 torso-link origins are not homologous
    distal_arms: source frame-0 and neutral-G1 arm poses differ
  root_displacement_scale_parameter: separately_frozen_from_ls_initial_value
  local_body_scale_parameter: shared_semantic_landmark_ls_value
  root_anchor_parameter: neutral_g1_pelvis_at_source_frame0
  root_local_and_anchor_frozen_separately: true
  head_to_toe:
    definition: neutral_g1_head_to_mean_toe_over_source_frame0_head_to_mean_toe
    role: diagnostic_only_not_a_transplant_policy
  registration_must_precede_formal_runs: true

within_method_variants:
  - id: native
    root_multiplier: 1.0
    local_multiplier: 1.0
  - id: root_minus_5
    root_multiplier: 0.95
    local_multiplier: 1.0
  - id: root_plus_5
    root_multiplier: 1.05
    local_multiplier: 1.0
  - id: local_minus_5
    root_multiplier: 1.0
    local_multiplier: 0.95
  - id: local_plus_5
    root_multiplier: 1.0
    local_multiplier: 1.05
within_method_protocol:
  root_origin: first_frame
  apply_before_solver: true
  posthoc_qpos_rescale_forbidden: true
  preserve_native_region_and_axis_structure: true

controlled_policy_transplant:
  solver: controlled_dense_mink
  canonical_robot: holosoma_g1_29dof
  fixed:
    - source_timestamps
    - task_set
    - weights
    - joint_limits
    - iteration_budget
    - initialization
    - root_anchor
    - contact_labels
  policies:
    - common_shared_semantic_landmark_ls
    - holosoma_lafan_uniform
    - gmr_region_wise
    - protomotions_v2_3_world_axis
    - protomotions_v3_lower_upper_axis
  label: controlled_policy_ablation
  official_method_label_forbidden: true
  protomotions_v3_dense_targets: formula-inspired extrapolation for Dense-only head/torso targets absent from the public v3 target set
  canonical_robot_contract:
    scene: external/holosoma/src/holosoma/holosoma/data/robots/g1/scenes/scene_g1_29dof_wbt_plane.xml
    qpos_width: 36
    actuated_joint_count: 29
    joint_order: canonical_g1_29
    semantic_fk: CanonicalRobotModel.semantic_positions/v1

contact_protocol:
  pure_scale_arm: fixed_canonical_labels
  record_native_recomputation:
    - label_flip_rate
    - constraint_edge_flip_rate
  recomputed_contact_run_required_when_conclusion_changes: true

actor_shape_policy_formula_probe:
  body_model: neutral_smplx
  consumes_amass_motion: false
  constructor_evidence_grade: formula_reconstruction_bound_to_official_source_hash
  runtime_constructor_observed: false
  not_used_as_accuracy_or_ranking_evidence: true
  interpretation_scope: AMASS shape-policy differences only
  exact_lafan_runtime_targets_evidenced_separately: manifests/native_pre_solver_targets.csv
  beta_profiles:
    - short
    - zero
    - tall
  frozen_pose_and_root_path: true
  outputs:
    - method_height
    - target_spans
    - root_gain
    - local_gain
    - contact_label_changes
    - target_sha256

required_metrics:
  - pre_solver_target_geometry
  - rf_kpe_targeted
  - rf_kpe_untracked
  - root_error_common_native_scale_invariant
  - task_residual
  - reach_infeasible_frame_rate
  - temporal_metrics
  - artifact_components
  - contact_and_constraint_flip_rate
  - completion
  - qpos_and_fk_divergence_from_native
  - end_to_end_and_native_core_timing
  - finite_difference_sensitivity
  - rank_stability

acceptance:
  full_pilot_frames_per_variant: 600
  method_specific_native_contract:
    protomotions_v3:
      frames: 450
      source_frame_range: [0, 450]
      official_policy: fixed 15-second trim-or-pad at 30 FPS
      full_source_coverage_ratio: 0.75
      comparison_scope: shared 450-frame prefix for every method
  minimum_completion_ratio: 0.95
  all_required_variants_mandatory: true
  native_and_controlled_separated: true
  raw_metrics_and_source_data_required: true
  validator_missing_requirement_decision: NO-GO

hard_stop_message: FULL-LAFAN EXPERIMENTS NOT STARTED — WAITING FOR USER APPROVAL.
