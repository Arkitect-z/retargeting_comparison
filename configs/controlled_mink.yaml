upstream_reference:
  repository: https://github.com/YanjieZe/GMR.git
  commit: bb1bbe40774794fceb2a7c579a3464a28e68c844
  config: general_motion_retargeting/ik_configs/bvh_lafan1_to_g1.json
robot_xml: external/GMR/assets/unitree_g1/g1_mocap_29dof.xml
common:
  solver: daqp
  damping: 0.5
  lm_damping: 1.0
  max_improvement_iterations: 10
  improvement_tolerance: 0.001
  position_scale_root_torso_legs: 0.875
  position_scale_arms: 0.7291666666666666
  posture_cost: 0.0001
  root_position_cost: 100.0
  root_yaw_cost: 5.0
  sequential_warm_start: true
  configuration_limit: true
  seed_perturbation_fraction: 0.08
  seed_random_values: {neutral: 0, A: 1101, B: 2202}
target_sets:
  sparse:
    - {semantic: root, human_joint: Hips, robot_body: pelvis, position_cost: 100.0, yaw_cost: 5.0, scale_group: root_torso_legs}
    - {semantic: left_wrist, human_joint: LeftHand, robot_body: left_wrist_yaw_link, position_cost: 10.0, scale_group: arms}
    - {semantic: right_wrist, human_joint: RightHand, robot_body: right_wrist_yaw_link, position_cost: 10.0, scale_group: arms}
    - {semantic: left_ankle, human_joint: LeftFoot, robot_body: left_ankle_roll_link, position_cost: 50.0, scale_group: root_torso_legs}
    - {semantic: right_ankle, human_joint: RightFoot, robot_body: right_ankle_roll_link, position_cost: 50.0, scale_group: root_torso_legs}
  dense:
    - {semantic: root, human_joint: Hips, robot_body: pelvis, position_cost: 100.0, yaw_cost: 5.0, scale_group: root_torso_legs}
    - {semantic: torso, human_joint: Spine2, robot_body: torso_link, position_cost: 10.0, scale_group: root_torso_legs}
    - {semantic: head, human_joint: Head, robot_body: head_mocap, position_cost: 10.0, scale_group: root_torso_legs}
    - {semantic: left_shoulder, human_joint: LeftArm, robot_body: left_shoulder_yaw_link, position_cost: 5.0, scale_group: arms}
    - {semantic: right_shoulder, human_joint: RightArm, robot_body: right_shoulder_yaw_link, position_cost: 5.0, scale_group: arms}
    - {semantic: left_elbow, human_joint: LeftForeArm, robot_body: left_elbow_link, position_cost: 10.0, scale_group: arms}
    - {semantic: right_elbow, human_joint: RightForeArm, robot_body: right_elbow_link, position_cost: 10.0, scale_group: arms}
    - {semantic: left_wrist, human_joint: LeftHand, robot_body: left_wrist_yaw_link, position_cost: 10.0, scale_group: arms}
    - {semantic: right_wrist, human_joint: RightHand, robot_body: right_wrist_yaw_link, position_cost: 10.0, scale_group: arms}
    - {semantic: left_hip, human_joint: LeftUpLeg, robot_body: left_hip_yaw_link, position_cost: 10.0, scale_group: root_torso_legs}
    - {semantic: right_hip, human_joint: RightUpLeg, robot_body: right_hip_yaw_link, position_cost: 10.0, scale_group: root_torso_legs}
    - {semantic: left_knee, human_joint: LeftLeg, robot_body: left_knee_link, position_cost: 10.0, scale_group: root_torso_legs}
    - {semantic: right_knee, human_joint: RightLeg, robot_body: right_knee_link, position_cost: 10.0, scale_group: root_torso_legs}
    - {semantic: left_ankle, human_joint: LeftFoot, robot_body: left_ankle_roll_link, position_cost: 50.0, scale_group: root_torso_legs}
    - {semantic: right_ankle, human_joint: RightFoot, robot_body: right_ankle_roll_link, position_cost: 50.0, scale_group: root_torso_legs}
    - {semantic: left_toe, human_joint: LeftToe, robot_body: left_toe_link, position_cost: 25.0, scale_group: root_torso_legs}
    - {semantic: right_toe, human_joint: RightToe, robot_body: right_toe_link, position_cost: 25.0, scale_group: root_torso_legs}
